# Cabeceras de seguridad. Se incluyen en cada location porque un add_header
# dentro de una location anula los del bloque server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Report-Only: el navegador avisa en la consola sin bloquear. Cuando la demo no
# muestre violaciones en los dos flujos, pasar a Content-Security-Policy (docs/deploy.md).
# Sin 'unsafe-inline' en script-src: un script inyectado no puede leer el JWT.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://secure.mlstatic.com https://www.google-analytics.com https://www.googletagmanager.com https://maps.googleapis.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://stackpath.bootstrapcdn.com; font-src 'self' data: https://fonts.gstatic.com https://stackpath.bootstrapcdn.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'" always;
