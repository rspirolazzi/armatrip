# Plantilla: el Dockerfile reemplaza __BASE__ por la ruta de publicación.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    # Las redirecciones no deben perder el https ni el dominio del proxy.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # __REDIRECT__

    # Los archivos compilados llevan hash en el nombre.
    location __BASE__/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de React Router: cualquier otra devuelve index.html.
    location __BASE__/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ __BASE__/index.html;
    }
}
