ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Equivale a "php artisan storage:link", sin crear un enlace en el host.
    Alias /storage /var/www/html/storage/app/public
    <Directory /var/www/html/storage/app/public>
        Require all granted
        Options -Indexes
        AllowOverride None
        php_admin_flag engine off
    </Directory>

    # Sin query string: el JWT viaja como parámetro "token".
    LogFormat "%h %t \"%m %U\" %>s %b" sinquery
    CustomLog ${APACHE_LOG_DIR}/access.log sinquery
    ErrorLog ${APACHE_LOG_DIR}/error.log
</VirtualHost>
