# Backend: verifica siempre; desde main publica ghcr.io/<dueño>/armatrip-backend y,
# después hace pull y up en el servidor demo (docs/deploy.md).
name: armatrip-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/armatrip-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/armatrip-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la verificación de un PR, pero nunca un despliegue en curso.
concurrency:
  group: armatrip-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE: armatrip-backend

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Entorno Docker del desarrollo local (docs/docker.md), con .env descartables.
      - name: Crear archivos de entorno descartables
        shell: pwsh
        run: ./docker/preparar-entorno.ps1

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # El tag es el que espera Compose: <proyecto>-<servicio>.
      - name: Construir la imagen de desarrollo
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: dev
          load: true
          tags: armatrip-backend:latest
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      # El entrypoint descubre paquetes, migra y siembra una base vacía.
      - name: Levantar, migrar y sembrar
        run: docker compose up -d --no-build --wait --wait-timeout 300 mysql backend

      - name: Validar composer.json y composer.lock
        run: docker compose exec -T backend composer validate --no-check-publish --no-check-all

      - name: Sintaxis PHP
        run: |
          docker compose exec -T backend sh -c '
            find app bootstrap/app.php config database packages routes tests -name "*.php" -print0 |
              xargs -0 -n1 -P4 php -l > /tmp/lint.log 2>&1 || { grep -v "^No syntax errors" /tmp/lint.log; exit 1; }
          '

      # Con config:cache, env() devuelve null fuera de config/.
      - name: Sin env() fuera de config
        run: |
          if grep -rnE '\b(get)?env\(' backend/app backend/packages backend/resources backend/routes --include='*.php' | grep -v '/config/'; then
            echo "::error::Usar config() en lugar de env() fuera de config/ (AGENTS.md)."
            exit 1
          fi

      # Carga rutas y controladores con la configuración cacheada, como en producción.
      # Se limpia siempre: con caché, PHPUnit ignoraría las variables de phpunit.xml.
      - name: Cargar rutas y controladores (config:cache)
        run: >-
          docker compose exec -T backend sh -c
          'php artisan config:cache > /dev/null && php artisan route:list > /dev/null; status=$?; php artisan config:clear > /dev/null; exit $status'

      # La suite API recrea y siembra esta base descartable; por eso va al final.
      - name: Tests (PHPUnit)
        run: docker compose exec -T backend vendor/bin/phpunit

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color --tail 200 mysql backend

  publish:
    name: Publicar imagen
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # El registro exige el dueño en minúsculas.
      - name: Nombre de la imagen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

  deploy:
    name: Pull y up en el servidor
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Comprobar configuración
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DROPLET_IP DROPLET_USER SSH_PRIVATE_KEY DROPLET_SSH_FINGERPRINT DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto o la variable de GitHub: $name"
              missing=1
            fi
          done
          exit "$missing"

      # Acepta la huella de cualquier clave del servidor (ed25519, ecdsa o rsa), con o
      # sin el prefijo SHA256:, y deja solo esa clave como conocida para la conexión.
      - name: Verificar la identidad del servidor
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$DROPLET_SSH_FINGERPRINT" | tr -d '[:space:]')"
          expected="SHA256:${expected#SHA256:}"

          scanned="$(ssh-keyscan -T 15 -t ed25519,ecdsa,rsa "$DROPLET_IP" 2>/dev/null || true)"
          if [ -z "$scanned" ]; then
            echo "::error::No se pudo leer la clave del servidor por SSH (puerto 22). Revisar DROPLET_IP y el firewall."
            exit 1
          fi

          match=""
          while read -r line; do
            if [ "$(printf '%s\n' "$line" | ssh-keygen -lf - | awk '{print $2}')" = "$expected" ]; then
              match="$line"
            fi
          done <<< "$scanned"

          if [ -z "$match" ]; then
            echo "::error::DROPLET_SSH_FINGERPRINT no coincide con ninguna clave del servidor."
            echo "Huellas que presenta el servidor (copiar una, con SHA256:, y compararla en el servidor):"
            printf '%s\n' "$scanned" | ssh-keygen -lf -
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$match" > ~/.ssh/known_hosts

      - name: Actualizar el contenedor
        env:
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DROPLET_USER@$DROPLET_IP" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") SERVICE=$(printf '%q' "$SERVICE") bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Si el pull falla, se corta antes de tocar el contenedor en ejecución.
          if ! docker compose pull "$SERVICE"; then
            echo "::error::El servidor no pudo descargar $SERVICE. Revisar 'docker login ghcr.io' (docs/deploy.md). No se cambió nada."
            exit 1
          fi
          # Recrea solo este servicio y espera su healthcheck.
          docker compose up -d --no-deps --wait --wait-timeout 180 "$SERVICE"

          docker image prune -f || true
          docker compose ps
          docker compose images "$SERVICE"
          EOF

      - name: Borrar la clave del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
