# Servidor. Copiar esta carpeta al servidor y completar .env y backend.env (ver docs/deploy.md).
# Usa las imágenes publicadas por GitHub Actions; en el servidor no se compila nada.
name: armatrip

services:
  armatrip-mysql:
    image: mysql:5.7
    platform: linux/amd64
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Falta DB_DATABASE en .env}
      MYSQL_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  armatrip-backend:
    image: ghcr.io/${IMAGE_OWNER:-rspirolazzi}/armatrip-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      armatrip-mysql:
        condition: service_healthy
    # Solo en el host: delante va un proxy con HTTPS.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8085}:80"
    env_file: backend.env
    # Tienen prioridad sobre backend.env.
    environment:
      APP_ENV: production
      APP_DEBUG: "false" # true habilitaría la terminal web /sys-terminal
      DB_CONNECTION: mysql
      DB_HOST: armatrip-mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Imágenes subidas, ajustes (settings.json), sesiones y logs.
      - backend_storage:/var/www/html/storage
    # Prueba PHP y la base: queda "unhealthy" hasta migrar (docs/deploy.md).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/api/provinces"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  armatrip-frontend:
    image: ghcr.io/${IMAGE_OWNER:-rspirolazzi}/armatrip-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3085}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  backend_storage:
